# NetBox service account
# Bound to the 'netbox' OpenBao Kubernetes auth role defined in
# openbao-config.tf by the platform team. This allows the OpenBao
# Agent Injector sidecar to authenticate to OpenBao and fetch secrets
# from secret/netbox/* at pod startup.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: netbox
  namespace: netbox