# NetBox Helm chart values
#
# Secret management:
#   All secrets are fetched from OpenBao at pod startup via the OpenBao
#   Agent Injector sidecar. Secrets are written as files to /bao/secrets/
#   and never stored as Kubernetes Secrets.
#
#   The platform team must create the following secrets in OpenBao at
#   secret/netbox/config before the application can start:
#     secret-key:            Django session encryption key (50+ chars)
#     superuser-password:    Initial admin password
#     superuser-api-token:   Initial admin API token (40 hex chars)
#     postgresql-password:   PostgreSQL password
#     valkey-password:       Valkey password
#     email-password:        SMTP email password (can be empty)
#
# Networking:
#   Service type is ClusterIP — external access via NGINX Ingress
#   managed by Terraform in netbox.tf.
#
# Ingress:
#   Disabled — managed by Terraform in netbox.tf.
#
# Node scheduling:
#   All NetBox components run on worker nodes.

allowedHosts:
  - "netbox.famillelebreuil.net"

superuser:
  name: admin
  email: "admin@famillelebreuil.net"
  existingSecret: "netbox-secrets"

existingSecret: "netbox-secrets"

# Single web replica
replicaCount: 1

externalDatabase:
  existingSecretName: "netbox-secrets"
  existingSecretKey: "postgresql-password"

taskQueuing:
  existingSecretName: "netbox-secrets"
  existingSecretKey: "valkey-password"

cachingDatabase:
  existingSecretName: "netbox-secrets"
  existingSecretKey: "valkey-password"

email:
  existingSecretName: "netbox-secrets"
  existingSecretKey: "email-password"

# Valkey — standalone mode to minimise resource usage
valkey:
  architecture: standalone
  auth:
    existingSecret: "netbox-secrets"
    existingSecretPasswordKey: "valkey-password"
  primary:
    nodeSelector:
      custom.kaas.infomaniak.cloud/node-role: "worker"

# PostgreSQL
postgresql:
  primary:
    nodeSelector:
      custom.kaas.infomaniak.cloud/node-role: "worker"

# Node scheduling — all components on worker nodes
nodeSelector:
  custom.kaas.infomaniak.cloud/node-role: "worker"

worker:
  replicaCount: 1
  nodeSelector:
    custom.kaas.infomaniak.cloud/node-role: "worker"

housekeeping:
  enabled: false

# Service — ClusterIP only, ingress managed by Terraform
service:
  type: ClusterIP

# Persistence — disabled to avoid ReadWriteOnce PVC scheduling issues
persistence:
  enabled: false

# Ingress — disabled, managed by Terraform in netbox.tf
ingress:
  enabled: false

# Probe timeouts — extended to allow database migrations on first run
livenessProbe:
  initialDelaySeconds: 120
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 5

readinessProbe:
  initialDelaySeconds: 60
  periodSeconds: 20
  timeoutSeconds: 10
  failureThreshold: 5

# OpenBao Agent Injector annotations
# The injector sidecar fetches secrets from OpenBao at pod startup
# and writes them to /bao/secrets/config inside the pod.
# The init container then creates the netbox-secrets Kubernetes Secret
# from the injected file so the chart can reference it via existingSecret.
podAnnotations:
  bao.openbao.org/agent-inject: "true"
  bao.openbao.org/role: "netbox"
  bao.openbao.org/agent-inject-secret-config: "secret/data/netbox/config"
  bao.openbao.org/agent-inject-template-config: |
    {{- with secret "secret/data/netbox/config" -}}
    secret-key={{ .Data.data.secret-key }}
    superuser-password={{ .Data.data.superuser-password }}
    superuser-api-token={{ .Data.data.superuser-api-token }}
    postgresql-password={{ .Data.data.postgresql-password }}
    valkey-password={{ .Data.data.valkey-password }}
    email-password={{ .Data.data.email-password }}
    {{- end }}