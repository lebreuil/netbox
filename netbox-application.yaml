# NetBox Argo CD Application manifest
#
# Managed by: Platform team (in platform GitOps repository)
# Source: NetBox application repository on GitHub
#
# This manifest registers the NetBox application with Argo CD.
# Argo CD accesses the repository using the organisation-wide GitHub App
# credential template configured in argocd-values.yaml.
#
# Prerequisites before applying:
#   1. NetBox namespace created (deploy/namespace.yaml in app repo)
#   2. NetBox service account created (deploy/serviceaccount.yaml in app repo)
#   3. NetBox secrets created in OpenBao UI at secret/netbox/config
#   4. OpenBao policy and role created in openbao-config.tf
#   5. Argo CD has access to the GitHub organisation via GitHub App
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netbox
  namespace: argocd
  # Ensures all NetBox resources are deleted when this Application is removed
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/your-org/netbox-repo
    targetRevision: HEAD
    path: deploy
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: netbox

  syncPolicy:
    automated:
      prune: true       # removes resources deleted from Git
      selfHeal: true    # reverts manual changes to match Git
    syncOptions:
      - CreateNamespace=false  # namespace managed in deploy/namespace.yaml
