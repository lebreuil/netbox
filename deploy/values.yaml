# NetBox Helm chart values
#
# Secret management:
#   External Secrets Operator synchronizes the namespace-local OpenBao
#   secret into the netbox-secrets Kubernetes Secret.
#
#   The platform team must create the following secrets in OpenBao at
#   secret/config in the NetBox OpenBao namespace before the application can start:
#     secret-key:            Django session encryption key (50+ chars)
#     superuser-password:    Initial admin password
#     superuser-api-token:   Initial admin API token (40 hex chars)
#     postgresql-password:   PostgreSQL password
#     valkey-password:       Valkey password
#     email-password:        SMTP email password (can be empty)
#
# Networking:
#   Service type is ClusterIP — external access via NGINX Ingress
#   managed by Terraform in netbox.tf.
#
# Ingress:
#   Disabled — managed by Terraform in netbox.tf.
#
# Node scheduling:
#   All NetBox components run on worker nodes.

allowedHosts:
  - "netbox.famillelebreuil.net"

superuser:
  name: admin
  email: "admin@famillelebreuil.net"
  existingSecret: "netbox-secrets"

existingSecret: "netbox-secrets"

# Single web replica
replicaCount: 1

taskQueuing:
  existingSecretName: "netbox-secrets"
  existingSecretKey: "valkey-password"

cachingDatabase:
  existingSecretName: "netbox-secrets"
  existingSecretKey: "valkey-password"

email:
  existingSecretName: "netbox-secrets"
  existingSecretKey: "email-password"

# Valkey — standalone mode to minimise resource usage
valkey:
  architecture: standalone
  auth:
    existingSecret: "netbox-secrets"
    existingSecretPasswordKey: "valkey-password"
  primary:
    nodeSelector:
      custom.kaas.infomaniak.cloud/node-role: "worker"

# PostgreSQL - deployed by the NetBox chart
postgresql:
  enabled: true
  primary:
    nodeSelector:
      custom.kaas.infomaniak.cloud/node-role: "worker"

# Node scheduling — all components on worker nodes
nodeSelector:
  custom.kaas.infomaniak.cloud/node-role: "worker"

worker:
  replicaCount: 1
  nodeSelector:
    custom.kaas.infomaniak.cloud/node-role: "worker"

housekeeping:
  enabled: false

# Service — ClusterIP only, ingress managed by Terraform
service:
  type: ClusterIP

# Persistence — disabled to avoid ReadWriteOnce PVC scheduling issues
persistence:
  enabled: false

# Ingress — disabled, managed by Terraform in netbox.tf
ingress:
  enabled: false

# Probe timeouts — extended to allow database migrations on first run
livenessProbe:
  initialDelaySeconds: 120
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 5

readinessProbe:
  initialDelaySeconds: 60
  periodSeconds: 20
  timeoutSeconds: 10
  failureThreshold: 5

# Secrets are synchronized by the namespace-local ExternalSecret in
# deploy/manifests/external-secrets.yaml. The resulting netbox-secrets Secret
# is referenced by the chart settings above.